name: Hormona
description: >-
  Hormona is a women's hormonal-health company founded in 2020 by Karolina
  Lofqvist and Jasmine Tagesson, with offices in London, UK and Stockholm,
  Sweden. It builds a hormone-tracking mobile app together with an at-home
  hormone monitor and urine-test kits that users scan with a phone camera to get
  real-time, quantitative hormone results without a lab visit. The app uses AI to
  learn each user's patterns and predict when PMS or period symptoms are likely,
  offering 30+ tools to manage hormonal symptoms and supporting women from their
  first period through perimenopause and menopause. Hormona is distributed on the
  App Store and Google Play and is used by women in 185+ countries. It is a
  direct-to-consumer product with no public developer API program.
